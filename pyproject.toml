[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobai"
version = "0.1.0"
description = "Multi-tenant job-matching platform built on a job-search automation engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "langgraph>=1.2",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "PyJWT[crypto]>=2.8",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "sentry-sdk[fastapi]>=2.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "E501", "E702", "E731", "B017"]
