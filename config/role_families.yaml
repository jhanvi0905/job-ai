# Role taxonomy v2 — the PRODUCT path's role families (docs/COVERAGE.md).
#
# The legacy single-user pipeline keeps config/roles.yaml (RF01–RF04) and
# prompts/classify_job_v2.txt untouched; `legacy_aliases` below maps those ids
# (and the old role_type names that resume parsing emits) onto these families.
#
# Per family:
#   label            shown to users (GET /role-families)
#   summary          one line for the classify_job_v3 prompt (keep it short: it costs tokens per job)
#   title_signals    Stage 0: case-insensitive regexes over the job TITLE; any hit = the title belongs here
#   negative_signals Stage 0: a hit cancels this family's positive match ("Sales Engineer" is not
#                    software engineering; "Product Marketing Manager" is not product management)
#   seniority        ladder hints (docs + reviewers) and `not_too_senior`: title phrases where a
#                    "too senior" keyword is part of an ordinary title ("Staff Accountant")
#   vocab            typical requirement vocabulary; Stage 0 keyword_score (ranking only)
#   adjacent         families a career switcher in this family commonly moves to; the user
#                    must OPT IN to each (prefs.adjacent_families) before it passes the gates
#
# Regex notes: titles are matched with re.IGNORECASE; prefer \b word boundaries;
# French titles are listed explicitly (Quebec postings are often French-only).
# Every change here must keep tests/product/test_coverage_eval.py green.

version: 2

# Stage 0 rejects these titles for every family: task/gig work that looks like a role.
global_negative_signals:
  - '\b(ai|llm|model)\s+(trainer|tutor|rater|evaluator)'
  - '\bannotat(or|ion)'
  - '\bdata label'
  - '\bfreelance (writer|tutor)'

# Old ids -> v2 ids. Used for stored prefs, achievement tags and model output.
legacy_aliases:
  RF01: ai_ml
  RF02: ai_ml
  RF03: data_analytics
  RF04: ai_ml
  ai_ml_engineering: ai_ml
  research_scientist: ai_ml
  data_engineering: data_analytics
  data_science: data_analytics
  data_analysis: data_analytics
  analytics: data_analytics
  software_engineering_general: software_engineering
  software_engineering: software_engineering
  product_management: product_management
  solutions_or_customer_facing: sales
  customer_support: customer_success
  project_management: operations
  program_management: operations
  human_resources: people_hr
  recruiting: people_hr
  accounting: finance
  it: it_security
  security: it_security
  ux_design: design

families:
  software_engineering:
    label: Software engineering
    summary: builds and ships software (backend, frontend, mobile, QA, DevOps/SRE, engineering managers)
    title_signals:
      - '\bsoftware (engineer|developer|architect|development engineer)'
      - '\b(back[- ]?end|front[- ]?end|full[- ]?stack|mobile|ios|android|web|embedded|firmware|game|platform|application|qa|test|automation|build|release|devops|java|python|golang|ruby|rails|react|node(\.js)?|\.net|c\+\+|c#|php|typescript|javascript|rust|kotlin|swift|scala)\s+(engineer|developer|programmer)'
      - '\bdeveloper\b'
      - '\bprogrammer\b'
      - '\bsdet\b'
      - '\bsite reliability\b'
      - '\bsre\b'
      - '\bdevops\b'
      - '\bengineering (manager|lead)'
      - '\bfounding engineer'
      - 'd[ée]veloppeu(r|se)'
      - '\bing[ée]nieur(e)? (logiciel|d[ée]veloppement)'
    negative_signals:
      - '\bbusiness develop'
      - '\b(sales|solutions?|pre-?sales|customer success|support|field|forward deployed) engineer'
      - '\bdeveloper (relations|advocate|evangelist)'
      - '\bsalesforce\b'
      - '\b(real estate|property|land) developer'
      - '\binstructional'
    seniority:
      ladder: [junior/new grad, developer/engineer, senior, staff/lead, principal, engineering manager, director]
      not_too_senior: []
    vocab: [python, java, javascript, typescript, react, apis, microservices, aws, kubernetes, ci/cd, sql, testing]
    adjacent: [ai_ml, data_analytics, it_security, product_management]

  data_analytics:
    label: Data & analytics
    summary: analyses or engineers data (data/BI/business analysts, analytics engineers, data engineers, data scientists)
    title_signals:
      - '\bdata (analyst|scientist|engineer|architect|modell?er|steward|specialist|science|engineering|analytics|visuali[sz]ation)'
      - '\banalytics\b'
      - '\bbusiness intelligence\b'
      - '\bbi (analyst|developer|engineer|specialist|lead)'
      - '\b(reporting|insights?|business|product|marketing|growth|pricing|research|quantitative|statistical) analyst'
      - '\bstatistician\b'
      - '\b(power bi|tableau|looker|sql|etl) (developer|analyst|engineer)'
      - '\banalyste\b'
      - '\bdonn[ée]es\b'
      - '\bscientifique des donn'
    negative_signals:
      - '\bdata entry'
      - '\bdata cent(er|re)'
      - '\bdata (protection|privacy)'
      - '\b(financial|finance|credit|investment|security|cyber|soc|it|systems|operations|hr|people) analyst'
      - '\banalyste (financier|financi[eè]re|cr[ée]dit|s[ée]curit[ée])'
      - '\bsaisie de donn'
    seniority:
      ladder: [junior analyst, analyst, senior analyst, lead/principal, analytics manager, director of analytics]
      not_too_senior: []
    vocab: [sql, python, excel, tableau, power bi, looker, dbt, statistics, a/b testing, dashboards, etl, data modeling]
    adjacent: [ai_ml, software_engineering, finance, product_management, marketing, operations]

  ai_ml:
    label: AI & machine learning
    summary: builds ML/AI systems (ML/AI/LLM engineers, applied/research scientists, MLOps)
    title_signals:
      - '\b(ai|ml|mlops|llm|llms|nlp|genai)\b'
      - '\bmachine learning'
      - '\bdeep learning'
      - '\bcomputer vision'
      - '\bgen(erative)? ?ai\b'
      - '\bapplied scientist'
      - '\bresearch (scientist|engineer)'
      - '\bprompt engineer'
      - '\bintelligence artificielle'
      - '\bapprentissage automatique'
    negative_signals:
      - '\b(sales|account|marketing|recruit|partnership|business development)'
      - '\bproduct (manager|owner|marketing)'
      - '\bdesigner\b'
    seniority:
      ladder: [ml engineer, senior, staff/lead, principal, ml manager, head of ai]
      not_too_senior: []
    vocab: [python, pytorch, tensorflow, llm, rag, mlops, model deployment, evaluation, embeddings, nlp, computer vision, spark]
    adjacent: [data_analytics, software_engineering, product_management]

  product_management:
