# Product catalog sources (src/jobai/product/services/catalog.py) — broad Canadian hiring.
# The legacy single-user pipeline keeps config/sources.yaml; the catalog ingests
# BOTH (this file + sources.yaml when include_legacy_sources is true), de-duplicated
# by (type, identifier), with the same fetch concurrency as the legacy run
# (process_job.FETCH_WORKERS boards in parallel, aggregators sequential).
#
# Every board below was fetched ONCE on 2026-10-07 from the public ATS API and
# returned HTTP 200 with jobs. jobs = total open postings that day; canada = postings
# whose location named Canada / a Canadian city or province (SmartRecruiters: first
# 100 postings only). 122 employers were tried: 74 boards answered with jobs; 46 were
# kept (>= 3 Canadian postings, not already in sources.yaml, not too heavy to page).
# Dropped: 37 tokens that 404'd (or answered empty) on Greenhouse/Lever/Ashby (e.g. Shopify, Clio, Coveo,
# FreshBooks, ecobee, Visier, Dayforce, HubSpot, Canva), 11 SmartRecruiters ids that
# answered with zero postings (Visa, IKEA, Canadian Tire, Sobeys, Telus Digital, ...),
# and 28 live boards with no/very few Canadian roles or thousands of postings
# (Datadog, Figma, Intercom, Plaid, Bosch, Accor, DoorDash, ...).
# Re-verify by fetching each board once before adding or removing entries (never in tests).

include_legacy_sources: true

