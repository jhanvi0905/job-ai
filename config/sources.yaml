# Job source registry — target companies to poll.
# Do NOT hardcode companies in connector code; everything lives here.
#
# tier controls poll frequency (interpreted by the scheduler, not the source adapters):
#   A = high-value target, poll frequently (every run)
#   B = good target, poll daily
#   C = discovery / long-tail, poll less frequently (e.g. every 3rd run)
#
# `identifier` is the source's board token, verified live against the public
# Greenhouse/Lever APIs on 2026-09-21 (see README for how to re-verify / add more).

companies:
  # --- Tier A: AI-native, large open role count, strong fit for RF01/RF02 ---
