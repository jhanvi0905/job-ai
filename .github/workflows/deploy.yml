name: Deploy

# Production: every push to main deploys once CI has passed on that commit.
# Staging: run manually (Actions -> Deploy -> Run workflow) with a Fly app name.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: "Fly app to deploy to (e.g. jobmatch-api-staging)"
        required: true
        default: "jobmatch-api-staging"
      app_env:
        description: "APP_ENV for the deployed app"
        required: true
        default: "staging"
        type: choice
        options: [staging, prod]

permissions:
  contents: read

jobs:
  production:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy credentials
        id: creds
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # Until Fly is set up, merges to main stay green and simply don't deploy.
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::FLY_API_TOKEN is not configured"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}   # exactly the commit CI tested
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.creds.outputs.ready == 'true'
      - name: flyctl deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: flyctl deploy --remote-only --build-arg GIT_SHA="$GIT_SHA" --wait-timeout 600

  staging:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: flyctl deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GIT_SHA: ${{ github.sha }}
          APP_NAME: ${{ inputs.app }}
          APP_ENV: ${{ inputs.app_env }}
        run: |
          # Inputs are passed via env (never interpolated into the script) and validated.
          if ! [[ "$APP_NAME" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]]; then echo "invalid app name" >&2; exit 1; fi
          flyctl deploy --app "$APP_NAME" --remote-only --build-arg GIT_SHA="$GIT_SHA" -e APP_ENV="$APP_ENV" --wait-timeout 600
