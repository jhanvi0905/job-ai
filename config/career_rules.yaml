# Deterministic filtering rules (Stage 0 — zero model calls).
# All values here are config, not code. Change freely without touching filters.py.

location:
  # This is about ELIGIBILITY, not job-posting geography: "can the candidate
  # (based in candidate_country) actually work this job", regardless of what
  # country the company itself is in. To retarget later (Canada, elsewhere),
  # change candidate_country — nothing else needs to change.
  candidate_country: "India"

  # Remote only, for now (2026-09-22 correction) — India-remote or open-to-
  # anywhere-globally, not on-site/hybrid even when physically in India.
  # filters.py's On-site/Hybrid eligibility logic still exists and still
  # works correctly (verified) — re-add "Hybrid"/"On-site" here later if
  # that preference changes; no code change needed either way.
  allowed_workplace_types:
    - Remote

  # Signals that mean "open globally / explicitly open to candidate_country" —
  # presence of any of these clears a restrictive/named-region hit below.
  # Deliberately does NOT include "remote" itself: being remote does not
  # imply global scope (see "Remote - United States").
  eligible_signals:
    - "global"
    - "anywhere"
    - "worldwide"
    - "international"
    - "apac"
    - "india"

  # Specific country/region names that, when they appear ALONE in the
  # location field with no eligible_signal alongside them, mark a "Remote"
  # job as restricted to that country/region. Catches ATS location strings
  # like "Remote - United States" that never say "must be based in..." in
  # prose but still mean the same thing.
  location_named_regions:
    - "united states"
    - "usa"
    - "u.s."
    - "canada"
    - "united kingdom"
    - "emea"
    - "europe"
    - "north america"

  # Remote-job text signals that mean the role is geographically restricted
  # AWAY from candidate_country. A job is excluded only if one of these
  # appears AND candidate_country is not also explicitly named — this is a
  # text heuristic, not a legal read of visa/tax eligibility, so it's
  # deliberately permissive: ambiguous cases fall through to Stage 1 AI
  # triage rather than being silently killed here.
  restrictive_signals:
    - "us only"
    - "u.s. only"
    - "usa only"
    - "united states only"
    - "us-based"
    - "us based"
    - "within the united states"
    - "must be based in the united states"
    - "must be authorized to work in the united states"
    - "canada only"
    - "uk only"
    - "u.k. only"
    - "eu only"
    - "emea only"
    - "must reside in"

  # If true, a job with no parseable location/workplace_type is NOT auto-rejected —
  # it falls through to Stage 1 AI triage instead of being deterministically killed,
  # since free-text locations are often ambiguous ("Remote (US)" vs "Remote - EMEA only").
  unknown_location_passes_through: true

recency:
  # Jobs older than this are hard-excluded at Stage 0. Configurable, not hardcoded.
  max_age_days: 30

seniority:
  hard_exclude_keywords:
    - "intern"
    - "internship"
    - "new grad"
    - "junior"
    - "entry level"
    - "entry-level"
    - "apprentice"
  # Levels that in practice demand 8+ years and/or people-org ownership —
  # far above the candidate's experience (see experience: below). Matched as
  # whole words in the TITLE only.
  too_senior_title_keywords:
    - "director"
    - "vice president"
    - "vp"
    - "head of"
    - "principal"
    - "staff"
    - "distinguished"
    - "fellow"
    - "chief"

# Years-of-experience gate. Deterministic (regex over the JD, zero tokens):
# a JD that asks for far more years than the candidate has is a long shot, so
# it never reaches the AI or Notion. Candidate has ~3 years (Dec 2023 onward
# plus short 2019-2020 stints, per resume) — update total_years when that
# changes; the rest is config, not code.
experience:
  total_years: 3
  # Exclude when the JD's stated minimum exceeds this. 6 = "6+ years" still
  # reaches the AI (startups often flex); 7+ is excluded.
  max_required_years: 6
  # Exclude when the JD's stated MAXIMUM is at or below this ("0-2 years",
  # "up to 2 years") — junior roles for someone already leading a team.
  junior_cap_years: 2

# Title must carry an AI/ML/data signal (whole-word regexes, case-insensitive)
# OR match a role-family alias in roles.yaml. This is what stops generic
# "Senior Software Engineer - Backend/Infra/Search" postings that only got
# through on AI-company boilerplate keywords.
title_signals:
  require_any:
    - '\bai\b'
    - '\bml\b'
    - 'machine learning'
    - 'deep learning'
    - '\bllm'
    - 'gen ?ai'
    - 'generative'
    - '\bnlp\b'
    - 'computer vision'
    - '\bdata\b'
    - 'mlops'
    - 'agent'
    - 'applied scientist'
    - 'research engineer'
    - 'research scientist'
    - 'inference'
    - '\brag\b'
    - 'retrieval'
    - 'analytics engineer'
  reject_if_any:
    - 'data center'
    - 'data entry'
    - 'analyst'
    - 'data governance'
    - 'data protection'

# Stage 1/3 write gates: a job is written to Notion only if the AI says it's
# at least this good a fit. Order: strong > plausible > weak > no.
ai_gates:
  allowed_role_types:
    - ai_ml_engineering
    - data_engineering
  min_classifier_fit: plausible
  min_match_fit: plausible
  # Safety cap on deep-match calls per run (Stage 3 is the pricier call).
  max_deep_matches_per_run: 60

hard_exclusions:
  title_keywords:
    - "security clearance required"
    - "TS/SCI"
    - "citizenship required"
    # Non-engineering functions. Real AI/ML companies' Greenhouse postings
    # repeat the same "About Us" boilerplate (which name-drops AI/ML/BigQuery
    # etc.) across EVERY req, including Payroll and Sales — so keyword_weights
    # alone lets those through. These titles are unambiguous noise regardless
    # of company; genuinely ambiguous titles (Solutions Architect, Forward
    # Deployed Engineer, Technical Support) are deliberately left OUT of this
    # list for Stage 1 AI triage to judge, since whether those count as
    # in-scope is a real product-scope call, not a clear-cut exclusion.
    - "account executive"
    - "account director"
    - "account manager"
    - "sales"
    - "recruiter"
    - "recruiting"
    - "payroll"
    - "procurement"
    - "accountant"
    - "accounting"
    - "collections"
    - "sap "
    - "sox "
    - "customer success"
    - "product marketing"
    - "marketing manager"
    - "hr business partner"
    - "total rewards"
    - "tutor"
    - "editor"
    - "legal counsel"
    - "paralegal"
  description_keywords:
    - "must be a US citizen"
    - "active security clearance"

employment_type:
  # Jobs of these types are excluded outright (config, not code).
  excluded:
    - "Internship"
    - "Temporary"

# Weighted keyword assists used only to break ties / rank within Stage 0 —
# never used alone to reject a job.
keyword_weights:
  LLM: 3
  agent: 2
  RAG: 3
  evaluation: 1
  Python: 1
  Kafka: 2
  BigQuery: 2
  streaming: 1
  MLOps: 2
  "distributed systems": 2
  "Vertex AI": 2
  embeddings: 2
  orchestration: 2
  "production AI": 3
