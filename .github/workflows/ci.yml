name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src scripts tests migrations
      - run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: sqlite:///ci-migrations.db
        run: |
          alembic upgrade head
          alembic check

  # Non-blocking: known CVEs in runtime deps surface as a warning, not a red build.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install pip-audit
      - name: pip-audit (runtime requirements)
        run: |
          if ! pip-audit -r requirements.txt --progress-spinner off; then
            echo "::warning title=pip-audit::vulnerable dependencies found; see the log of this job"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
